# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    solarClientId: '%env(string:SOLAR_CLIENT_ID)%'
    solarClientSecret: '%env(string:SOLAR_CLIENT_SECRET)%'
    solarDeviceId: '%env(string:SOLAR_DEVICE_ID)%'
    solarApiUrl: '%env(string:SOLAR_API_URL)%'
    atlanticTokenUrl: '%env(string:ATLANTIC_TOKEN_URL)%'
    atlanticTokenAuthorization: '%env(string:ATLANTIC_TOKEN_AUTHORIZATION)%'
    atlanticUsername: '%env(string:ATLANTIC_USERNAME)%'
    atlanticPassword: '%env(string:ATLANTIC_PASSWORD)%'
    magellanTokenUrl: '%env(string:MAGELLAN_TOKEN_URL)%'
    overkizTokenUrl: '%env(string:OVERKIZ_TOKEN_URL)%'
    overkizAuthorization: '%env(string:OVERKIZ_AUTHORIZATION)%'
    overkizEndpointUrl: '%env(string:OVERKIZ_ENDPOINT_URL)%'
    overkizEndpointCommandUrl: '%env(string:OVERKIZ_ENDPOINT_COMMAND_URL)%'
    backgroundPath: '%env(string:BACKGROUND_PATH)%'
    backgroundTokenDefault: ''
    backgroundTokenLegacy: '%env(default:backgroundTokenDefault:VITE_BACKGROUND_TOKEN)%'
    backgroundToken: '%env(default:backgroundTokenLegacy:BACKGROUND_TOKEN)%'
    thermorApiTokenDefault: ''
    thermorApiToken: '%env(string:default:thermorApiTokenDefault:THERMOR_API_TOKEN)%'
    appTimezone: '%env(string:APP_TIMEZONE)%'
    openWeatherApiUrlDefault: 'https://api.openweathermap.org/data/3.0/onecall'
    openWeatherApiUrlLegacy: '%env(default:openWeatherApiUrlDefault:VITE_OPENWEATHERMAP_API_URL)%'
    openWeatherApiUrl: '%env(default:openWeatherApiUrlLegacy:OPENWEATHERMAP_API_URL)%'
    openWeatherApiKeyDefault: ''
    openWeatherApiKeyLegacy: '%env(default:openWeatherApiKeyDefault:VITE_OPENWEATHERMAP_API_KEY)%'
    openWeatherApiKey: '%env(default:openWeatherApiKeyLegacy:OPENWEATHERMAP_API_KEY)%'
    openWeatherCoordinateDefault: ''
    openWeatherLatLegacy: '%env(default:openWeatherCoordinateDefault:VITE_OPENWEATHERMAP_LAT)%'
    openWeatherLat: '%env(default:openWeatherLatLegacy:OPENWEATHERMAP_LAT)%'
    openWeatherLonLegacy: '%env(default:openWeatherCoordinateDefault:VITE_OPENWEATHERMAP_LON)%'
    openWeatherLon: '%env(default:openWeatherLonLegacy:OPENWEATHERMAP_LON)%'
    openWeatherUnitsDefault: 'metric'
    openWeatherLangDefault: 'fr'
    openWeatherUnitsLegacy: '%env(default:openWeatherUnitsDefault:VITE_OPENWEATHERMAP_UNITS)%'
    openWeatherUnits: '%env(default:openWeatherUnitsLegacy:OPENWEATHERMAP_UNITS)%'
    openWeatherLangLegacy: '%env(default:openWeatherLangDefault:VITE_OPENWEATHERMAP_LANG)%'
    openWeatherLang: '%env(default:openWeatherLangLegacy:OPENWEATHERMAP_LANG)%'
    fuelStationNameLegacy: '%env(default:openWeatherApiKeyDefault:VITE_FUEL_API_STATION_NAME)%'
    fuelStationName: '%env(default:fuelStationNameLegacy:FUEL_API_STATION_NAME)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            $solarClientId: '%solarClientId%'
            $solarClientSecret: '%solarClientSecret%'
            $solarDeviceId: '%solarDeviceId%'
            $solarApiUrl: '%solarApiUrl%'
            $atlanticTokenUrl: '%atlanticTokenUrl%'
            $atlanticTokenAuthorization: '%atlanticTokenAuthorization%'
            $atlanticUsername: '%atlanticUsername%'
            $atlanticPassword: '%atlanticPassword%'
            $magellanTokenUrl: '%magellanTokenUrl%'
            $overkizTokenUrl: '%overkizTokenUrl%'
            $overkizAuthorization: '%overkizAuthorization%'
            $overkizEndpointUrl: '%overkizEndpointUrl%'
            $overkizEndpointCommandUrl: '%overkizEndpointCommandUrl%'
            $backgroundPath: '%backgroundPath%'
            $backgroundToken: '%backgroundToken%'
            $thermorApiToken: '%thermorApiToken%'
            $appTimezone: '%appTimezone%'
            $openWeatherApiUrl: '%openWeatherApiUrl%'
            $openWeatherApiKey: '%openWeatherApiKey%'
            $openWeatherLat: '%openWeatherLat%'
            $openWeatherLon: '%openWeatherLon%'
            $openWeatherUnits: '%openWeatherUnits%'
            $openWeatherLang: '%openWeatherLang%'
            $fuelStationName: '%fuelStationName%'

    # Automatically injects dependencies in your services.
    # Inject parameters as env variables

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Utils\SearchSlugger:
        public: true
    Symfony\Component\String\Slugger\SluggerInterface: '@App\Utils\SearchSlugger'