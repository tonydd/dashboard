services:
  frontend:
    image: node:20
    container_name: app_frontend
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5174:5174" # Vite
    environment:
      - HOST=0.0.0.0
    depends_on:
      php:
        condition: service_started

  php:
    build:
      context: Docker/php
      dockerfile: Dockerfile
    container_name: app_php
    volumes:
      - ./symfony:/var/www/html
      - ${BACKGROUND_HOST_PATH:-./symfony/var/backgrounds}:${BACKGROUND_PATH:-/srv/backgrounds}:ro
    working_dir: /var/www/html/public
    environment:
      BACKGROUND_PATH: ${BACKGROUND_PATH:-/srv/backgrounds}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Paris}
      THERMOR_API_TOKEN: ${THERMOR_API_TOKEN:-}
    command: sh -c "cd /var/www/html && composer install --no-interaction --prefer-dist && php -S 0.0.0.0:80 -t public"
    ports:
      - "8000:80"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: app_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-symfony}
      MYSQL_USER: ${MYSQL_USER:-dashboard}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dashboard}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${MYSQL_PORT:-33061}:3306"
    volumes:
      - database_data:/var/lib/mysql

volumes:
  database_data:
