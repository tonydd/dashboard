services:
  php:
    build:
      context: Docker/php
      dockerfile: Dockerfile
    container_name: app_php
    volumes:
      - ./symfony:/var/www/html
      - ${BACKGROUND_HOST_PATH:-./symfony/var/backgrounds}:${BACKGROUND_PATH:-/srv/backgrounds}:ro
    working_dir: /var/www/html/public
    environment:
      BACKGROUND_PATH: ${BACKGROUND_PATH:-/srv/backgrounds}
      BACKGROUND_TOKEN: ${BACKGROUND_TOKEN:-${VITE_BACKGROUND_TOKEN:-}}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Paris}
      THERMOR_API_TOKEN: ${THERMOR_API_TOKEN:-}
      OPENWEATHERMAP_API_URL: "${OPENWEATHERMAP_API_URL:-${VITE_OPENWEATHERMAP_API_URL:-https://api.openweathermap.org/data/3.0/onecall}}"
      OPENWEATHERMAP_API_KEY: "${OPENWEATHERMAP_API_KEY:-${VITE_OPENWEATHERMAP_API_KEY:-}}"
      OPENWEATHERMAP_LAT: "${OPENWEATHERMAP_LAT:-${VITE_OPENWEATHERMAP_LAT:-}}"
      OPENWEATHERMAP_LON: "${OPENWEATHERMAP_LON:-${VITE_OPENWEATHERMAP_LON:-}}"
      OPENWEATHERMAP_UNITS: "${OPENWEATHERMAP_UNITS:-${VITE_OPENWEATHERMAP_UNITS:-metric}}"
      OPENWEATHERMAP_LANG: "${OPENWEATHERMAP_LANG:-${VITE_OPENWEATHERMAP_LANG:-fr}}"
      FUEL_API_STATION_NAME: "${FUEL_API_STATION_NAME:-${VITE_FUEL_API_STATION_NAME:-}}"
    command: sh -c "cd /var/www/html && composer install --no-interaction --prefer-dist && php -S 0.0.0.0:80 -t public"
    ports:
      - "8000:80"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: app_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-symfony}
      MYSQL_USER: ${MYSQL_USER:-dashboard}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dashboard}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${MYSQL_PORT:-33061}:3306"
    volumes:
      - database_data:/var/lib/mysql

volumes:
  database_data:
